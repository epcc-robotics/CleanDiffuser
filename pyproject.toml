[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cleandiffuser"
version = "0.1.0+h84"
description = "CleanDiffuser @ 05f17fc with the EPCC ChiUNet1d horizon patch. Dependencies are declared by the EPCC repository (upstream pins numba<0.60, which forces numpy<2)."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[tool.setuptools.packages.find]
include = ["cleandiffuser*"]
